[phases.setup]
# 24, not 22: the pinned nodejs_22 is 22.11, which predates require(ESM), so rolldown's
# wasm fallback died loading @emnapi/core. It also ships npm 10, whose handling of
# optional dependencies is what lost the native binary in the first place.
nixPkgs = ["nodejs_24"]

[phases.install]
# ci, not install: npm install skipped rolldown's linux binary when resolving against a
# lockfile built elsewhere (npm/cli#4828) and the build died with "Cannot find native
# binding". ci wipes node_modules and takes the lockfile literally, platform binaries and
# all. --include=dev because the builder sets the production config, and the build needs
# vite and typescript.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server/index.js"
